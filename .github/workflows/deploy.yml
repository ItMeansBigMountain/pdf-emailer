name: Deploy Azure Function App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd function_app
        pip install -r requirements.txt --target=".python_packages/lib/site-packages"

    - name: Zip function app
      run: |
        cd function_app
        zip -r ../function_app.zip .

    - name: Deploy to Azure Function App
      uses: Azure/functions-action@v1
      with:
        app-name: pdf-emailer-func
        package: function_app.zip
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        scm-do-build-during-deployment: true
        enable-oryx-build: true

  post-deployment-test:
    runs-on: ubuntu-latest
    needs: build-and-deploy  # Ensure this job runs after the deployment job

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run integration tests
      env:
        AZURE_FUNCTION_BASE_URL: ${{ secrets.AZURE_FUNCTION_BASE_URL }} 
        AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}  
      run: |
        python function_app/integration_test.py